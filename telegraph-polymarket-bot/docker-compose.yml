services:
  api:
    build:
      context: ./api
    ports:
      - "3001:3001"
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=mongodb://mongodb:27017/sniper_bot?directConnection=true
      - TELEGRAPH_WS_URL=ws://13.237.89.59:7044/engine/ws
      - SERVICE_WALLET_PRIVATE_KEY=${SERVICE_WALLET_PRIVATE_KEY}
      - SIGNAL_INTENTS=LANGUAGE_GENERATION,CHAT_COMPLETION,TEXT_GENERATION,HIGH_PERFORMANCE_INFERENCE,EMBEDDINGS,CONTENT_MODERATION,WEATHER_CHECK,STORM_ALERT,WEATHER_FORECAST,WEATHER_RISK_ASSESSMENT,MULTIMODAL_INFERENCE,IMAGE_GENERATION,TEXT_TO_IMAGE,TASK_COMPLETION,AGENT_TASK,WEB_SEARCH,TWITTER_SEARCH,NEWS_SEARCH,RESEARCH_SYNTHESIS,FACT_CHECK,TEXT_AUTHENTICITY_CHECK,AI_TEXT_DETECTION,CONTENT_VERIFICATION,DEEPFAKE_DETECTION,MEDIA_AUTHENTICITY_CHECK,IMAGE_VERIFICATION,VIDEO_VERIFICATION
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]

  mongo-init:
    image: mongo:latest
    depends_on:
      - mongodb
    restart: on-failure
    command: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
          console.log("Replica set already initialized");
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
          console.log("Replica set initialized");
        }
      '

volumes:
  mongodb_data:
